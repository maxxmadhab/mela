<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MELA — From the hills, directly to you</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F5F1E8;--paper:#FAF8F3;--ink:#282722;--line:#DCD6CC;--terra:#B96D52;--olive:#74765B;--sand:#D8C9B3;--sh:rgba(40,39,34,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ivory:#1d1c19;--paper:#262520;--ink:#F1ECE0;--line:#3b3932;--sh:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--ivory:#1d1c19;--paper:#262520;--ink:#F1ECE0;--line:#3b3932;--sh:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--ivory);color:var(--ink);font:400 15px/1.55 Inter,system-ui,sans-serif;letter-spacing:-.01em;overflow-x:hidden}
h1,h2,h3{font-weight:600;letter-spacing:-.03em;line-height:1.02}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--olive);font-weight:500;margin-bottom:16px}
.big{font-size:clamp(38px,6vw,84px)}
.btn{display:inline-block;padding:14px 30px;border:1px solid currentColor;border-radius:99px;letter-spacing:.16em;font-size:11px;text-transform:uppercase;font-weight:500;transition:.35s}
.btn:hover{background:var(--ink);color:var(--ivory);border-color:var(--ink);transform:scale(1.05)}
.btn.fill{background:var(--ink);color:var(--ivory);border-color:var(--ink)}.btn.fill:hover{background:var(--terra);border-color:var(--terra);color:#fff}
.ph{position:relative;overflow:hidden;background:var(--c1,#d8c9b3)}
.ph:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.1) 14px 15px),linear-gradient(160deg,var(--c1),var(--c2,#74765B));transition:transform 1s}
.ph:after{content:attr(data-l);position:absolute;left:14px;bottom:12px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s,transform 1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
section,.page{padding:110px 5vw}
/* header */
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;background:color-mix(in srgb,var(--ivory) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:22px;letter-spacing:.12em}.logo small{display:block;font-size:9px;letter-spacing:.2em;font-weight:400;text-transform:uppercase;opacity:.6;margin-top:2px}
nav{display:flex;gap:28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
nav a{position:relative;padding:4px 0}nav a:after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--terra);transition:.3s}nav a:hover:after,nav a.on:after{width:100%}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--terra);color:#fff;font-size:10px;margin-left:5px}
@media(max-width:700px){nav{gap:14px;font-size:10px}.logo small{display:none}}
.pgbar{position:fixed;top:0;left:0;height:2px;background:var(--terra);z-index:90;width:0}
/* landing */
#landing{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;color:#F5F1E8;background:radial-gradient(ellipse at 50% 120%,#B96D52,transparent 55%),linear-gradient(180deg,#1f2a2e,#3d4a4b 55%,#74765B);transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
#landing.gone{transform:translateY(-100%)}
.mtn{position:absolute;bottom:0;left:0;width:100%;height:55%}
.cloud{position:absolute;height:60px;width:240px;border-radius:60px;background:rgba(255,255,255,.12);filter:blur(14px);animation:drift 32s linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.l-in{position:relative;padding:24px;max-width:860px}.l-in>*{opacity:0;transform:translateY(30px);animation:up 1.2s forwards}
.l-in .k{letter-spacing:.4em;font-size:11px;text-transform:uppercase;animation-delay:.2s}
.l-in h1{font-size:clamp(54px,11vw,140px);letter-spacing:.06em;margin:18px 0;animation-delay:.5s}
.l-in p{max-width:460px;margin:0 auto 34px;opacity:.85;animation-delay:.9s}.l-in .btn{animation-delay:1.2s}
@keyframes up{to{opacity:1;transform:none}}
#landing .btn:hover{background:#F5F1E8;color:#282722}
/* story */
.story{display:grid;grid-template-columns:1fr 1.1fr;gap:6vw;align-items:center;min-height:100vh}
.story p{opacity:.8;margin-top:20px;max-width:480px}
.stats{display:flex;gap:40px;margin-top:36px;border-top:1px solid var(--line);padding-top:24px}.stats b{display:block;font-size:42px;font-weight:600;letter-spacing:-.04em;color:var(--terra)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:230px 230px;gap:14px}
.mosaic .ph{border-radius:4px;transition:.6s}.mosaic .ph:nth-child(1){grid-row:span 2}.mosaic .ph:nth-child(4){grid-column:span 1}
.mosaic:hover .ph{opacity:.6}.mosaic .ph:hover{opacity:1;transform:scale(1.04);z-index:2;box-shadow:0 24px 50px -16px var(--sh)}.mosaic .ph:hover:before{transform:scale(1.12)}
@media(max-width:800px){.story{grid-template-columns:1fr}}
/* crafts */
.chead{padding:110px 5vw 40px}.chead p{max-width:520px;opacity:.75;margin-top:18px}
.chap{display:grid;grid-template-columns:1.25fr 1fr;min-height:100vh;align-items:center;gap:5vw;padding:60px 5vw;border-top:1px solid var(--line)}
.chap:nth-child(even){grid-template-columns:1fr 1.25fr}.chap:nth-child(even) .pic{order:2}
.pic{height:78vh;border-radius:4px;clip-path:inset(12% 12% 12% 12%);transition:clip-path 1.4s cubic-bezier(.2,.7,.2,1)}
.chap.in .pic{clip-path:inset(0)}.pic:hover:before{transform:scale(1.08)}
.num{font-size:clamp(70px,10vw,150px);font-weight:600;letter-spacing:-.06em;color:var(--sand);line-height:.8;margin-bottom:10px}
.chap h3{font-size:clamp(32px,4vw,56px)}.chap .meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.chip{font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:5px 12px}.chip.t{background:var(--terra);color:#fff;border-color:var(--terra)}
.chap p{opacity:.8;max-width:440px}.chap .fact{margin-top:22px;padding-left:16px;border-left:2px solid var(--terra);font-size:13px;opacity:.9}
@media(max-width:800px){.chap,.chap:nth-child(even){grid-template-columns:1fr}.chap:nth-child(even) .pic{order:0}.pic{height:50vh}}
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:10px}
.dots a{width:8px;height:8px;border-radius:50%;border:1px solid var(--ink);transition:.3s}.dots a.on{background:var(--terra);border-color:var(--terra);transform:scale(1.5)}
.cta{text-align:center;border-top:1px solid var(--line)}
/* shop */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0}.filters button{border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:.3s}.filters .on,.filters button:hover{background:var(--ink);color:var(--ivory)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--paper);border-radius:4px;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s,opacity .4s;cursor:pointer;position:relative}
.card .ph{aspect-ratio:3/4}.card:hover{transform:scale(1.07);z-index:5;box-shadow:0 30px 60px -18px var(--sh)}.card:hover .ph:before{transform:scale(1.15)}
.pgrid:hover .card:not(:hover){opacity:.55}
.card .info{padding:16px 18px 18px}.card h3{font-size:18px}.card .by{font-size:12px;opacity:.6;margin-top:2px}.card .pr{margin-top:8px;font-weight:500;color:var(--terra)}
.card .more{max-height:0;opacity:0;overflow:hidden;transition:.5s;font-size:12px}.card:hover .more{max-height:50px;opacity:.8;margin-top:6px}
/* modal */
#modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(20,19,16,.65);backdrop-filter:blur(8px);padding:20px}#modal.open{display:grid}
.mbox{display:grid;grid-template-columns:1fr 1fr;width:min(960px,100%);max-height:90vh;background:var(--paper);border-radius:8px;overflow:hidden;animation:pop .5s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{transform:scale(.88);opacity:0}}
.mbox .ph{min-height:440px}.mbox .body{padding:42px;display:flex;flex-direction:column;gap:14px;justify-content:center;overflow:auto}.mbox h3{font-size:38px}
.x{position:absolute;top:18px;right:24px;font-size:30px;color:#fff;z-index:2}
@media(max-width:700px){.mbox{grid-template-columns:1fr}.mbox .ph{min-height:230px}}
/* cart + connect */
.crow{display:grid;grid-template-columns:90px 1fr auto auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.crow .ph{aspect-ratio:3/4;border-radius:3px}.qty{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.sum{margin-top:36px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;font-size:22px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5vw;margin-top:50px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.box{background:var(--paper);padding:36px;border-radius:4px;transition:.5s}.box:hover{transform:translateY(-6px);box-shadow:0 30px 60px -20px var(--sh)}
.box input,.box textarea,.box select{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:12px;outline:0}.box input:focus,.box textarea:focus{border-color:var(--terra)}
footer{padding:44px 5vw;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;font-size:12px;opacity:.7;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--ivory);padding:12px 24px;border-radius:99px;transition:.5s;z-index:95}#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.pic{clip-path:none}}
</style>
</head>
<body>
<div class="pgbar" id="pg"></div>
<div id="landing">
  <div class="cloud" style="top:18%"></div><div class="cloud" style="top:34%;animation-delay:-16s;width:320px"></div>
  <svg class="mtn" viewBox="0 0 1440 400" preserveAspectRatio="none"><path id="m1" d="M0 260 L220 120 L380 230 L600 60 L820 240 L1040 110 L1250 220 L1440 140 V400 H0Z" fill="#4b5a57" opacity=".7"/><path id="m2" d="M0 330 L180 230 L360 310 L560 190 L780 320 L980 220 L1200 320 L1440 250 V400 H0Z" fill="#2c3633"/></svg>
  <div class="l-in"><div class="k">Himachal Pradesh · Direct from the hills</div><h1>MELA</h1><p>A marketplace where Pahadi artisans meet you — no middlemen, just makers and their stories.</p><button class="btn" id="enter">Enter mela</button></div>
</div>
<header>
  <a class="logo" href="#/">MELA<small>From the hills, directly to you</small></a>
  <nav><a href="#/" data-r="home">Home</a><a href="#/shop" data-r="shop">Shop</a><a href="#/connect" data-r="connect">Connect</a><a href="#/cart" data-r="cart">Cart<span class="badge" id="cc">0</span></a></nav>
</header>
<main id="app"></main>
<div id="modal"><button class="x" id="mx">×</button><div class="mbox" id="mb"></div></div>
<div id="toast"></div>
<footer><span>MELA · Himachal Pradesh</span><span>hello@mela.example</span><span>Sample content — replace with verified maker details</span></footer>

<script>
const $=s=>document.querySelector(s),inr=n=>"₹"+n.toLocaleString("en-IN");
const PR=[
["p1","Kullu Wool Shawl","Textiles","Sunita Devi","Naggar",4800,"#B96D52","#4b3a33"],
["p2","Kinnauri Pattern Stole","Textiles","Meena Negi","Kalpa",3600,"#74765B","#2c3633"],
["p3","Chamba Rumal Panel","Textiles","Kamla Thakur","Chamba",5200,"#D8C9B3","#B96D52"],
["p4","Deodar Carved Box","Woodcraft","Ramesh Kumar","Kullu",2900,"#8C5D4D","#282722"],
["p5","Ringal Bamboo Basket","Basketry","Pushpa Devi","Mandi",1400,"#a39a6a","#74765B"],
["p6","Hemp Fibre Bag","Textiles","Dolma Lama","Spiti",2200,"#c9c3b6","#74765B"],
["p7","Pahari Wool Cap","Textiles","Geeta Sharma","Manali",900,"#4b5a57","#1f2a2e"],
["p8","Walnut Wood Bowl","Woodcraft","Anil Thakur","Kangra",2400,"#6b4a3a","#282722"]];
const CR=[
["Kullu Wool","Craft","Wool of the valley","Soft, warm shawls spun from local sheep wool and woven on hand looms in Kullu valley homes. Patterns carry bands of colour traditionally worn by hill communities.","A single shawl can take several days of hand weaving.","#B96D52","#4b3a33"],
["Kinnauri Weaves","Craft","Patterns from the high valleys","Kinnaur’s weavers are known for geometric borders and bright accent bands, woven for caps, stoles and shawls that mark identity and occasion.","Motifs are often passed down within families.","#74765B","#2c3633"],
["Chamba Rumal","Craft","Embroidery as painting","Chamba rumals are embroidered with fine double-satin stitch, often showing scenes from Pahari miniature painting. Women have kept this craft alive for generations.","The design looks identical on both sides of the cloth.","#D8C9B3","#B96D52"],
["Deodar Wood","Raw material","The tree of the gods","Deodar, a Himalayan cedar, is prized for its scent and durability. It has long been used in hill homes, temples and hand-carved objects.","The name comes from a Sanskrit phrase meaning ‘timber of the gods’.","#8C5D4D","#282722"],
["Himalayan Wool & Fibres","Raw material","From fleece to thread","Sheep wool, goat hair and hemp fibre are cleaned, spun and woven into cloth. Each fibre behaves differently, and artisans choose them by feel.","Hemp has been woven in the hills for centuries.","#c9c3b6","#74765B"],
["Natural Dyes","Raw material","Colour from the landscape","Bark, roots, leaves and walnut husks give soft earthy shades. Colours vary slightly from batch to batch, which is what makes each piece one of a kind.","No two dye lots are exactly the same.","#a39a6a","#4b3a33"]];
let cart={};try{cart=JSON.parse(localStorage.getItem("mela-cart")||"{}")||{}}catch(e){cart={}}
const save=()=>{try{localStorage.setItem("mela-cart",JSON.stringify(cart))}catch(e){}$("#cc").textContent=Object.values(cart).reduce((a,b)=>a+b,0)};
const find=id=>PR.find(p=>p[0]===id);
const ph=(p,l)=>`<div class="ph" style="--c1:${p[6]};--c2:${p[7]}" data-l="${l||"Product image"}"></div>`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
function addCart(id){cart[id]=(cart[id]||0)+1;save();toast(find(id)[1]+" added to cart")}
const V={
home:()=>`
<section class="story" id="story"><div class="rv"><div class="eyebrow">Our story</div><h2 class="big">Made in the hills. Sold without middlemen.</h2>
<p>Mela is a marketplace built for Pahadi artisans and the people who value their work. Makers list their own pieces, set their own prices and tell their own stories — you buy straight from the source.</p>
<div class="stats"><div><b>0</b>middlemen</div><div><b>100%</b>maker-led</div><div><b>1</b>hill community</div></div><a class="btn fill" style="margin-top:34px" href="#/shop">Shop direct</a></div>
<div class="mosaic rv"><div class="ph" style="--c1:#74765B;--c2:#2c3633" data-l="Artisan portrait"></div><div class="ph" style="--c1:#B96D52;--c2:#4b3a33" data-l="Loom"></div><div class="ph" style="--c1:#D8C9B3;--c2:#8C5D4D" data-l="Village"></div><div class="ph" style="--c1:#4b5a57;--c2:#1f2a2e" data-l="Raw wool"></div></div></section>
<div id="crafts"><div class="chead rv"><div class="eyebrow">Crafts &amp; raw materials</div><h2 class="big">The hands and<br>materials of Himachal.</h2><p>Scroll through six chapters. Each one tells the story of a craft or a raw material that shapes what you find in mela.</p></div>
<div class="dots" id="dots">${CR.map((c,i)=>`<a href="#/crafts" data-d="${i}" title="${c[0]}"></a>`).join("")}</div>
${CR.map((c,i)=>`<article class="chap" data-c="${i}"><div class="pic ph" style="--c1:${c[5]};--c2:${c[6]}" data-l="${c[0]}"></div><div class="rv"><div class="num">0${i+1}</div><div class="meta"><span class="chip ${c[1]=="Craft"?"t":""}">${c[1]}</span></div><h3>${c[0]}</h3><div class="eyebrow" style="margin:14px 0">${c[2]}</div><p>${c[3]}</p><div class="fact">${c[4]}</div></div></article>`).join("")}</div>
<section class="cta"><h2 class="big">Meet the makers.</h2><p style="opacity:.7;margin:18px 0 30px">Browse pieces made by the people behind these crafts.</p><a class="btn fill" href="#/shop">Visit the shop</a></section>`,
shop:()=>`<div class="page"><div class="eyebrow">Shop</div><h2 class="big">Direct from<br>the makers.</h2>
<div class="filters">${["All","Textiles","Woodcraft","Basketry"].map((f,i)=>`<button class="${i?"":"on"}" data-f="${f}">${f}</button>`).join("")}</div>
<div class="pgrid" id="grid"></div></div>`,
cart:()=>{const ids=Object.keys(cart).filter(id=>find(id)&&cart[id]>0),t=ids.reduce((s,id)=>s+find(id)[5]*cart[id],0);
return `<div class="page"><div class="eyebrow">Cart</div><h2 class="big">Your selection.</h2><div style="margin-top:40px">${ids.length?ids.map(id=>{const p=find(id);return `<div class="crow">${ph(p)}<div><h3 style="font-size:20px">${p[1]}</h3><div style="opacity:.6;font-size:13px">by ${p[3]}, ${p[4]}</div></div><div class="qty"><button data-q="${id}:-1">−</button>${cart[id]}<button data-q="${id}:1">+</button></div><b>${inr(p[5]*cart[id])}</b></div>`}).join("")+`<div class="sum"><span>Total ${inr(t)}</span><button class="btn fill" id="co">Checkout (preview)</button></div><p style="opacity:.6;font-size:13px;margin-top:14px">Your payment goes directly to the makers. Checkout is a preview in this sample.</p>`:`<p style="opacity:.7">Your cart is empty.</p><a class="btn fill" style="margin-top:24px" href="#/shop">Go to shop</a>`}</div></div>`},
connect:()=>`<div class="page"><div class="eyebrow">Connect</div><h2 class="big">Let’s talk.</h2><div class="two">
<form class="box" data-t="Message sent — we’ll reply soon"><h3 style="font-size:26px;margin-bottom:20px">For buyers</h3><input placeholder="Name" required><input type="email" placeholder="Email" required><textarea rows="4" placeholder="Your message"></textarea><button class="btn fill">Send</button></form>
<form class="box" data-t="Thanks — we’ll reach out to you"><h3 style="font-size:26px;margin-bottom:20px">For artisans</h3><input placeholder="Name &amp; village" required><input placeholder="Phone / WhatsApp" required><select><option>Craft or material</option><option>Weaving</option><option>Embroidery</option><option>Woodcraft</option><option>Basketry</option><option>Other</option></select><textarea rows="3" placeholder="Tell us about your work"></textarea><button class="btn fill">Join mela</button></form></div></div>`};
function paint(f){const g=$("#grid");g.innerHTML=PR.filter(p=>f=="All"||p[2]==f).map(p=>`<div class="card rv in" data-id="${p[0]}">${ph(p)}<div class="info"><h3>${p[1]}</h3><div class="by">by ${p[3]} · ${p[4]}</div><div class="pr">${inr(p[5])}</div><div class="more">Click for a closer look, then add to cart.</div></div></div>`).join("")}
function quick(id){const p=find(id);$("#mb").innerHTML=`${ph(p,"Large view")}<div class="body"><div class="eyebrow">${p[2]} · ${p[4]}</div><h3>${p[1]}</h3><div style="font-size:26px;font-weight:600;color:var(--terra)">${inr(p[5])}</div><p style="opacity:.8">Handmade by ${p[3]} of ${p[4]}. Sample description — replace with the maker’s own story.</p><button class="btn fill" id="add">Add to cart</button></div>`;$("#modal").classList.add("open");$("#add").onclick=()=>{addCart(id);$("#modal").classList.remove("open")}}
let io;
function route(){const r=location.hash.replace("#/","")||"home",v=["shop","cart","connect"].includes(r)?r:"home";
$("#app").innerHTML=V[v]();document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r==v));
if(v=="shop")paint("All");
io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");if(e.target.dataset.c!=null)document.querySelectorAll("#dots a").forEach((d,i)=>d.classList.toggle("on",i==e.target.dataset.c))}}),{threshold:.3});
document.querySelectorAll(".rv,.chap").forEach(e=>io.observe(e));
if(r=="story"||r=="crafts")setTimeout(()=>$("#"+r).scrollIntoView(),50);else scrollTo(0,0)}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{
const f=e.target.closest("[data-f]");if(f){document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("on",b==f));paint(f.dataset.f);return}
const c=e.target.closest(".card");if(c)return quick(c.dataset.id);
const q=e.target.closest("[data-q]");if(q){const[id,d]=q.dataset.q.split(":");cart[id]=Math.max(0,(cart[id]||0)+ +d);if(!cart[id])delete cart[id];save();route();return}
if(e.target.id=="co")toast("Checkout is a preview in this sample");
if(e.target.id=="mx"||e.target.id=="modal")$("#modal").classList.remove("open")});
document.addEventListener("submit",e=>{e.preventDefault();toast(e.target.dataset.t);e.target.reset()});
addEventListener("keydown",e=>{if(e.key=="Escape")$("#modal").classList.remove("open")});
addEventListener("mousemove",e=>{const x=(e.clientX/innerWidth-.5)*30;$("#m1").style.transform=`translateX(${x}px)`;$("#m2").style.transform=`translateX(${-x*1.6}px)`});
addEventListener("scroll",()=>{$("#pg").style.width=(scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100)+"%"});
$("#enter").onclick=()=>{$("#landing").classList.add("gone");setTimeout(()=>$("#landing").style.display="none",1200)};
if(location.hash&&location.hash!="#/")$("#landing").style.display="none";
save();route();
</script>
